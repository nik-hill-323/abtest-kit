[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest-kit"
version = "0.1.0"
description = "Design and analyse A/B tests: power analysis, frequentist and Bayesian inference, sequential testing and CUPED variance reduction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nikhil Obuleni"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
abtest = "abtest.cli:main"

[tool.setuptools.packages.find]
include = ["abtest*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
